name: Bug report
description: Something is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag, or the commit if you run from source.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it
      options:
        - docker compose (published image)
        - docker compose --build (from source)
        - uv run fastapi dev (from source)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device (for board page bugs)
      placeholder: Chrome 131 on a Fire TV Stick 4K
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: "`docker compose logs departureboard` around the time it happened. Remove your token if it appears."
      render: text
