name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run pytest -q

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv lock --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: departureboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The compose files parse, with and without the dev overlay
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.dev.yaml config -q
      - name: Smoke test the image
        run: |
          docker run -d --name db -p 8000:8000 departureboard:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs db
          test "${ok:-0}" = 1
      - name: Smoke test the image with HTTPS (self-signed on first boot; the healthcheck must agree)
        run: |
          docker run -d --name tls -e DEPARTUREBOARD_TLS=self-signed -e DEPARTUREBOARD_TLS_HOSTS=board.local -p 8443:8000 departureboard:ci
          for i in $(seq 1 20); do
            if curl -fsSk https://127.0.0.1:8443/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs tls
          test "${ok:-0}" = 1
          docker logs tls 2>&1 | grep -q "self-signed certificate"
          docker logs tls 2>&1 | grep -q "DNS:board.local"
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' tls)
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          echo "health: $status"
          test "$status" = healthy
          # plain http on the same port is gone
          if curl -fsS --max-time 3 http://127.0.0.1:8443/api/health; then echo "http still answers"; exit 1; fi

  # The one check the branch ruleset requires.
  ci:
    runs-on: ubuntu-latest
    needs: [lint, test, lock, docker]
    steps:
      - run: echo "all green"
