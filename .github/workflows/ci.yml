name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run pytest -q

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv lock --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: departureboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The compose files parse, with and without the dev overlay
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.dev.yaml config -q
      - name: Smoke test the image
        run: |
          docker run -d --name db -p 8000:8000 departureboard:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs db
          test "${ok:-0}" = 1
      - name: Smoke test the image with HTTPS (self-signed on first boot; the healthcheck must agree)
        run: |
          docker run -d --name tls -e DEPARTUREBOARD_TLS=self-signed -e DEPARTUREBOARD_TLS_HOSTS=board.local -p 8443:8000 departureboard:ci
          for i in $(seq 1 20); do
            if curl -fsSk https://127.0.0.1:8443/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs tls
          test "${ok:-0}" = 1
          docker logs tls 2>&1 | grep -q "self-signed certificate"
          docker logs tls 2>&1 | grep -q "DNS:board.local"
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' tls)
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          echo "health: $status"
          test "$status" = healthy
          # plain http on the same port is gone
          if curl -fsS --max-time 3 http://127.0.0.1:8443/api/health; then echo "http still answers"; exit 1; fi

  # The one check the branch ruleset requires.
  ci:
    runs-on: ubuntu-latest
    needs: [lint, test, lock, docker]
    steps:
      - run: echo "all green"
