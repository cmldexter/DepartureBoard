<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>/* the device's appearance choice, applied before the first paint */
    try { var a = localStorage.getItem("departureboard.appearance"); if (a === "light" || a === "dark") document.documentElement.dataset.theme = a; } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DepartureBoard{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Board">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block icons %}{{ icon_sprite }}{% endblock %}
{% block body %}{% endblock %}
</body>
</html>
