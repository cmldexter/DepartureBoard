# DepartureBoard — one command, one board.
#
#   docker compose up -d
#   open http://<this machine>:8080 on the TV, and http://<this machine>:8080/settings on your laptop
#
# This pulls the published image. For a board on a wall, pin a version instead of `latest`:
# put DEPARTUREBOARD_IMAGE=ghcr.io/cmldexter/departureboard:0.1.0 in .env (see .env.example).
#
# Contributors build from this checkout instead:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build

services:
  departureboard:
    image: ${DEPARTUREBOARD_IMAGE:-ghcr.io/cmldexter/departureboard:latest}
    ports:
      - "${DEPARTUREBOARD_PORT:-8080}:8000"
    volumes:
      # The SQLite database, the generated token and uploaded pictures. A named volume so the
      # container's non-root user can always write it. To keep it in a folder instead:
      #   - ./data:/data   (and make sure uid 10001 can write that folder)
      - departureboard_data:/data
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      DEPARTUREBOARD_TZ: ${TZ:-UTC}
    restart: unless-stopped

volumes:
  departureboard_data:
