---
# Source: departureboard/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: departureboard-data
  namespace: departureboard
  labels:
    helm.sh/chart: departureboard-0.5.0
    app.kubernetes.io/name: departureboard
    app.kubernetes.io/instance: departureboard
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # The board's data outlives the release: `helm uninstall` leaves the claim behind.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# Source: departureboard/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: departureboard
  namespace: departureboard
  labels:
    helm.sh/chart: departureboard-0.5.0
    app.kubernetes.io/name: departureboard
