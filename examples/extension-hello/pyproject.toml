[project]
name = "departureboard-hello"
version = "0.1.0"
description = "The smallest complete DepartureBoard extension: a settings tab, a router, one stored key."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
# No dependency on the core: it is not a wheel. The extension is installed into the board's own
# environment (the image's /app/.venv, or a checkout's .venv), where `app` already imports.
dependencies = []

[project.entry-points."departureboard.extensions"]
hello = "departureboard_hello:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["departureboard_hello"]
