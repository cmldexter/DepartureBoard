[project]
name = "departureboard"
version = "0.1.0.dev0"
description = "An open-source split-flap departure board for any TV. One command, one board."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.120,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
