[project]
name = "departureboard"
version = "0.5.0"
description = "An open-source split-flap departure board for any TV. One command, one board."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.120,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.6,<3",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8.3",
    "httpx>=0.28",
    "zxing-cpp>=3.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Table-driven test cases read best on one line each.
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be call-site defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
